<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New EcoMeal login</title>
</head>
<body style="margin: 0; background-color: #f4f7f4; font-family: Arial, sans-serif;">
    <div style="max-width: 600px; margin: 0 auto; padding: 24px;">
        <div style="background-color: #2e7d32; padding: 24px; border-radius: 10px 10px 0 0; text-align: center;">
            <h1 style="color: #ffffff; font-size: 24px; margin: 0;">New login to EcoMeal</h1>
        </div>
        <div style="background-color: #ffffff; padding: 32px; border: 1px solid #dfe8df; border-top: 0; border-radius: 0 0 10px 10px;">
            <p style="color: #263238; font-size: 16px; margin-top: 0;">Hi <strong>{{UserName}}</strong>,</p>
            <p style="color: #546e5a; font-size: 15px; line-height: 1.6;">
                Your EcoMeal account was signed in successfully at
                <strong>{{LoginTime}}</strong>.
            </p>
            <div style="background-color: #f4f7f4; border-left: 4px solid #2e7d32; margin: 24px 0; padding: 16px;">
                <p style="color: #37474f; font-size: 14px; line-height: 1.5; margin: 0;">
                    If this was you, no action is needed. If you do not recognize this login,
                    change your password immediately.
                </p>
            </div>
            <p style="color: #78909c; font-size: 13px; margin-bottom: 0;">
                This is an automated security notification from EcoMeal.
            </p>
        </div>
    </div>
</body>
</html>
